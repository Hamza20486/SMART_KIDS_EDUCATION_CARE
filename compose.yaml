services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartkids
      POSTGRES_PASSWORD: smartkids_dev
      POSTGRES_DB: smart_kids
    ports:
      - "5432:5432"
    volumes:
      - smart_kids_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartkids -d smart_kids"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  smart_kids_postgres:
